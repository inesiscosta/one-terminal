name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PRs opened with the default GITHUB_TOKEN don't trigger CI, so with required checks on
          # main the release PR could never be merged. A fine-grained PAT (Contents + Pull requests:
          # read & write on this repo) in RELEASE_PLEASE_TOKEN fixes that; without it we fall back.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm verifies this workflow with a GitHub OIDC token, so no
      # NPM_TOKEN secret is needed, and provenance is attached automatically
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # A version that's already on npm (e.g. when re-running a release) is skipped instead of failing
      - name: Check whether this version is already on npm
        id: npm
        run: |
          spec=$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm, skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly type-checks, tests and builds before anything is uploaded
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --access public
